name: Publish Hedra

on:
  workflow_dispatch:
    inputs:
      buildConfig:
        description: Build configuration
        type: choice
        required: true
        default: Release
        options: [Release, Debug]

permissions:
  contents: read

concurrency:
  group: steam-test-deployment
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      configuration: ${{ inputs.buildConfig }}
      publish: true

  deploy_steam:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hedra-*
          path: builds
      - name: Restore Linux executable permissions and verify depots
        shell: bash
        run: |
          tar -xzf builds/hedra-linux-x64/linux-x64.tar.gz -C builds/hedra-linux-x64
          rm builds/hedra-linux-x64/linux-x64.tar.gz
          test -x builds/hedra-linux-x64/Hedra
          test -s builds/hedra-win-x64/Hedra.exe
          test -s builds/hedra-win-x86/Hedra.exe
          for archive in data1.db data2.db data3.db; do
            test -s "builds/hedra-assets/$archive"
          done
      - uses: game-ci/steam-deploy@50f6b29fc64922e19a16d202a88fe199d394b536 # v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 1009960
          buildDescription: ${{ github.sha }}
          rootPath: builds
          depot2Path: hedra-assets
          depot3Path: hedra-win-x86
          depot4Path: hedra-win-x64
          depot5Path: hedra-linux-x64
          releaseBranch: test
